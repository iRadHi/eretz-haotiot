<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>ארץ האותיות והמספרים</title><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}</style></head><body><title>ארץ האותיות והמספרים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Secular+One&family=Noto+Sans+Hebrew:wght@400;500;700&display=swap">
<style>
/* Layout concept: one phone-shaped game column, centred on wide screens. Screens swap in place: start, avatar, map (scrolling path), level (question + four answers), result, home (shop), parent settings. */
:root{
  --ink:#1F2B47; --ink2:#4E5E80; --paper:#EAF5FF; --card:#FFFFFF; --line:#D3E3F5; --line-d:#AFC6E2;
  --blue:#2FA0EA; --blue-d:#1B6DB3; --sun:#FFC940; --sun-d:#C98E0A; --leaf:#4CBF5F; --leaf-d:#2C8A3C; --berry:#EC5B78; --berry-d:#B83555;
  --ground:#5BBF6A;
  --font-display:'Secular One','Rubik',system-ui,sans-serif; --font-body:'Rubik',system-ui,sans-serif;
  --padx-l:max(16px, env(safe-area-inset-left, 0px)); --padx-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--font-body);font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer}
input,select{-webkit-user-select:text;user-select:text}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:3px solid var(--ink);outline-offset:2px}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:var(--paper);box-shadow:0 0 0 4px rgba(31,43,71,.25)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background-color:var(--paper);background-size:64px 64px}
.screen[hidden]{display:none!important}
.pad{padding-left:var(--padx-l);padding-right:var(--padx-r)}

.btn{border:0;border-radius:20px;padding:14px 24px;font:400 22px/1.1 var(--font-display);color:#fff;background:var(--blue);box-shadow:0 6px 0 var(--blue-d);transition:transform .08s,box-shadow .08s;min-height:56px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--blue-d)}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 6px 0 var(--sun-d)}
.btn.sun:active{box-shadow:0 2px 0 var(--sun-d)}
.btn.leaf{background:var(--leaf);box-shadow:0 6px 0 var(--leaf-d)}
.btn.leaf:active{box-shadow:0 2px 0 var(--leaf-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 6px 0 var(--line-d)}
.btn.ghost:active{box-shadow:0 2px 0 var(--line-d)}
.btn.sm{font-size:17px;padding:10px 16px;min-height:44px;border-radius:16px;box-shadow:0 4px 0 var(--blue-d)}
.btn.sm.ghost{box-shadow:0 4px 0 var(--line-d)}
.btn.berry{background:var(--berry);box-shadow:0 6px 0 var(--berry-d)}
.btn.block{display:block;width:100%}
.iconbtn{width:46px;height:46px;border-radius:50%;border:0;background:#fff;box-shadow:0 4px 0 var(--line-d);display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line-d)}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 12px 6px 14px;font:800 17px var(--font-body);box-shadow:0 3px 0 var(--line-d);min-height:34px}
.pill img{width:22px;height:22px;display:block}

/* avatar */
.av{position:relative;width:var(--s);height:var(--s);flex:none;--eye:30%}
.av-shape{--eye:44%}
.av-base{width:100%;height:100%;object-fit:contain;display:block}
.av-face{position:absolute;left:26%;top:41%;width:48%;display:block}
.acc{position:absolute;pointer-events:none;display:block}
.acc svg{display:block;width:100%;height:auto}
.acc-head{left:20%;top:-14%;width:60%}
.acc-face{left:14%;width:72%;top:var(--eye)}
.acc-neck{left:30%;bottom:-6%;width:40%}
.av-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.av-shadow{width:70%;height:auto;margin-top:-10%;opacity:.55;display:block}
.bob{animation:bob 2.2s ease-in-out infinite}
.hop{animation:hop .5s ease-out}
.wob{animation:shake .45s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-16px) scale(1.08)}100%{transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.25);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes rise{0%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-60px);opacity:0}}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.12)}}

/* start */
#sc-start{align-items:center;justify-content:center;text-align:center;gap:10px;background-color:var(--ground)}
.title-card{background:#fff;border-radius:32px;padding:18px 28px 16px;box-shadow:0 8px 0 rgba(31,43,71,.18);margin-bottom:6px}
.title-card h1{font:400 clamp(30px,8.6vw,44px)/1.1 var(--font-display);margin:0;color:var(--blue-d)}
.title-card p{margin:6px 0 0;font:500 17px var(--font-body);color:var(--ink2)}
.hello{font:400 26px var(--font-display);background:#fff;border-radius:999px;padding:6px 20px;box-shadow:0 4px 0 rgba(31,43,71,.18)}
.gear{position:absolute;top:max(14px, env(safe-area-inset-top, 0px));left:var(--padx-l)}

/* avatar picker */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:14px;padding-bottom:10px}
.topbar h2{margin:0;font:400 22px var(--font-display);background:#fff;border-radius:999px;padding:8px 20px;box-shadow:0 4px 0 var(--line-d);text-align:center}
.pick-preview{background:#fff;border-radius:28px;margin:0 var(--padx-r) 12px var(--padx-l);padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 6px 0 var(--line-d)}
.pick-preview b{font:400 26px var(--font-display)}
.pick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding-top:2px;overflow:auto;flex:1;align-content:start;padding-bottom:10px}
.tile{height:78px;border-radius:20px;background:#fff;border:4px solid transparent;box-shadow:0 4px 0 var(--line-d);display:flex;align-items:center;justify-content:center;padding:0}
.tile{position:relative}
.tile.locked .av,.item.locked .av{filter:brightness(0);opacity:.18}
.tile .lk{position:absolute;font-size:22px}
.tile[aria-pressed="true"]{border-color:var(--sun);box-shadow:0 0 0 3px #fff,0 4px 0 var(--sun-d)}
.bottom{padding-top:10px;padding-bottom:max(14px, env(safe-area-inset-bottom, 0px))}

/* map */
.map-head{background:#fff;padding-top:max(10px, env(safe-area-inset-top, 0px));padding-bottom:10px;box-shadow:0 3px 0 rgba(31,43,71,.15);position:relative;z-index:5}
.map-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.world-name{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0;flex:1}
.world-name b{font:400 21px var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.wbtn[disabled]{opacity:.3;cursor:default}
.map-meta{display:flex;gap:8px}
.wprog{display:flex;align-items:center;gap:10px;margin-top:8px}
.wprog .pill{padding:3px 10px 3px 12px;min-height:30px;font-size:16px}
.wprog .bar{flex:1;height:12px;background:var(--line);border-radius:999px;overflow:hidden}
.wprog .bar i{display:block;height:100%;background:var(--sun);border-radius:999px;width:0;transition:width .4s}
.wprog span{font:500 14px var(--font-body);color:var(--ink2);white-space:nowrap}
#map-scroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;background-size:64px 64px;-webkit-overflow-scrolling:touch}
#map-canvas{position:relative;width:100%}
#map-canvas svg{position:absolute;left:0;top:0;pointer-events:none}
.decor{position:absolute;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff)}
.node{position:absolute;transform:translate(-50%,-50%);border:0;padding:0;background:transparent;width:60px;height:60px}
.node .nb{position:absolute;inset:0;background-size:contain;background-repeat:no-repeat}
.node .nn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-bottom:5px;font:400 22px var(--font-display);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.28)}
.node.boss{width:76px;height:76px}
.node.boss .nn{font-size:28px;color:var(--ink);text-shadow:none}
.node.locked .nn{color:#eef2f7;opacity:.9}
.node.current{animation:pulse 1.4s ease-in-out infinite}
.node .nst{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);display:flex;gap:1px}
.node .nst img{width:17px;height:16px;display:block}
.map-av{position:absolute;transform:translate(-50%,-100%);pointer-events:none;z-index:3}
.map-av .bubble{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#fff;border-radius:14px;padding:4px 10px;font:400 14px var(--font-display);white-space:nowrap;box-shadow:0 3px 0 var(--line-d);margin-bottom:2px}
.map-foot{display:flex;gap:12px;padding-top:12px;padding-bottom:max(14px, env(safe-area-inset-bottom, 0px));background:#fff;box-shadow:0 -3px 0 rgba(31,43,71,.12);position:relative;z-index:5}
.map-foot .btn:first-child{flex:none}
.map-foot .btn.grow{flex:1}

/* level */
#sc-level{background-color:var(--ground)}
.hud{display:flex;align-items:center;gap:10px;padding-top:max(10px, env(safe-area-inset-top, 0px));padding-bottom:6px}
.hud-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.hud-line{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hud-title{font:400 16px var(--font-display);background:#fff;border-radius:999px;padding:3px 12px;box-shadow:0 3px 0 rgba(31,43,71,.2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hearts{display:flex;gap:3px;flex:none}
.hearts svg{width:24px;height:22px;display:block}
.pips{display:flex;gap:4px}
.pips i{flex:1;height:12px;border-radius:999px;background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 2px rgba(31,43,71,.18)}
.pips i.on{background:var(--sun);box-shadow:inset 0 -3px 0 var(--sun-d)}
.lv-card{background:#fff;border-radius:28px;box-shadow:0 7px 0 rgba(31,43,71,.2);margin:6px var(--padx-r) 0 var(--padx-l);padding:12px 14px 14px;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.chip{font:400 20px var(--font-display);background:var(--blue);color:#fff;border-radius:999px;padding:5px 18px;box-shadow:0 3px 0 var(--blue-d)}
.prompt-row{display:flex;align-items:center;gap:8px;width:100%;justify-content:center}
#lv-prompt{font:700 clamp(19px,5.4vw,24px)/1.25 var(--font-body);text-align:center;text-wrap:balance}
.speak{width:42px;height:42px;border-radius:50%;border:0;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:0;flex:none;box-shadow:0 3px 0 var(--line)}
#lv-visual{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden}
.eq{display:flex;align-items:center;justify-content:center;gap:10px;font:800 clamp(44px,13vw,60px)/1 var(--font-body);flex-wrap:nowrap;direction:ltr}
.eq .op{color:var(--blue-d)}
.eq .qm{display:inline-flex;align-items:center;justify-content:center;min-width:1.1em;color:var(--berry);background:#FFE9EE;border-radius:14px;padding:0 6px;border:3px dashed var(--berry)}
.eq.sm{font-size:clamp(32px,9vw,44px)}
.seq{display:flex;gap:10px;align-items:center;justify-content:center;direction:ltr;flex-wrap:wrap}
.seq .sn{font:800 clamp(36px,10vw,50px)/1 var(--font-body);min-width:1.3em;text-align:center;padding:6px 8px;border-radius:16px;background:var(--paper)}
.seq .sn.qm{color:var(--berry);background:#FFE9EE;border:3px dashed var(--berry)}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:300px;direction:ltr;--ds:32px}
.dot{width:var(--ds);height:var(--ds);display:block;border-radius:50%;background-size:contain;background-repeat:no-repeat;background-position:center}
.dot.star{background-image:var(--img-star);border-radius:0}
.dot.coin{background-image:var(--img-coin)}
.dot.red{background:radial-gradient(circle at 35% 30%,#ff9aa9 0 14%,var(--berry) 15% 100%);box-shadow:inset 0 -3px 0 var(--berry-d)}
.dot.blue{background:radial-gradient(circle at 35% 30%,#a6dcff 0 14%,var(--blue) 15% 100%);box-shadow:inset 0 -3px 0 var(--blue-d)}
.dot.green{background:radial-gradient(circle at 35% 30%,#b7f0c0 0 14%,var(--leaf) 15% 100%);box-shadow:inset 0 -3px 0 var(--leaf-d)}
.dot.gone{opacity:.28;filter:grayscale(1)}
.dots.small{--ds:20px;gap:4px;max-width:150px}
.dots.mid{--ds:26px;gap:5px}
.pair{display:flex;align-items:center;justify-content:center;gap:12px;direction:ltr}
.pair .op{font:800 32px var(--font-body);color:var(--blue-d)}
.signrow{display:flex;align-items:flex-start;justify-content:center;gap:12px;direction:ltr}
.signcol{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:80px}
.signcol .big{font:800 clamp(44px,13vw,60px)/1 var(--font-body)}
.qbox{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;font:800 38px var(--font-body);color:var(--berry);background:#FFE9EE;border:3px dashed var(--berry);border-radius:16px;margin-top:2px}
.blocks{display:flex;align-items:flex-end;gap:14px;justify-content:center;direction:ltr}
.tens{display:flex;gap:6px;align-items:flex-end}
.ten{display:grid;grid-template-rows:repeat(10,1fr);gap:2px;width:16px;height:96px;padding:3px;background:var(--blue-d);border-radius:6px}
.ten i{background:#8ED0FA;border-radius:2px;display:block}
.ones{display:grid;grid-template-columns:repeat(3,16px);gap:4px}
.ones i{width:16px;height:16px;background:var(--sun);border-radius:4px;box-shadow:inset 0 -3px 0 var(--sun-d);display:block}
#lv-opts{display:grid;gap:12px;grid-template-columns:1fr 1fr;padding-top:14px;padding-bottom:max(14px, env(safe-area-inset-bottom, 0px))}
#lv-opts.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{font:800 clamp(34px,10vw,46px)/1 var(--font-body);color:var(--ink);background:#fff;border:3px solid var(--line);border-radius:22px;min-height:clamp(70px,11vh,92px);box-shadow:0 6px 0 var(--line-d);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;padding:8px;transition:transform .08s,box-shadow .08s;direction:ltr}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--line-d)}
.opt small{font:700 15px var(--font-body);direction:rtl;color:var(--ink2)}
.opt.grp{min-height:clamp(84px,14vh,116px);padding:6px}
.opt.ok{background:var(--leaf);border-color:var(--leaf-d);color:#fff;box-shadow:0 6px 0 var(--leaf-d)}
.opt.ok small{color:#fff}
.opt.bad{background:var(--berry);border-color:var(--berry-d);color:#fff;box-shadow:0 6px 0 var(--berry-d);animation:shake .4s}
.opt.bad small{color:#fff}
.opt:disabled{cursor:default}
.opt.hide-after{opacity:.55}
.coinpop{position:absolute;left:50%;top:40%;z-index:9;display:flex;align-items:center;gap:4px;font:800 24px var(--font-body);color:var(--sun-d);animation:rise .9s ease-out forwards;pointer-events:none;background:#fff;border-radius:999px;padding:2px 10px 2px 8px;box-shadow:0 3px 0 var(--line-d)}
.coinpop img{width:24px;height:24px}

/* result */
#sc-result{align-items:center;justify-content:center;text-align:center;gap:12px;background-color:var(--ground)}
.res-card{background:#fff;border-radius:32px;box-shadow:0 8px 0 rgba(31,43,71,.2);padding:20px 22px;width:88%;max-width:380px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:10px}
.res-card h2{margin:0;font:400 34px var(--font-display);color:var(--blue-d)}
.res-card.lose h2{color:var(--berry-d)}
.res-stars{display:flex;gap:6px;direction:ltr;min-height:70px}
.res-stars img{width:62px;height:58px;display:block}
.res-stars img.pop{animation:pop .5s ease-out both}
.res-line{font:700 19px var(--font-body);display:flex;align-items:center;gap:8px;justify-content:center}
.res-line img{width:26px;height:26px}
.newworld{background:var(--sun);color:var(--ink);font:400 20px var(--font-display);border-radius:16px;padding:8px 14px;box-shadow:0 4px 0 var(--sun-d)}
.res-card .btn.ghost{background:var(--paper)}
.res-actions{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:6px}

/* home / shop */
#sc-home{background:var(--paper)}
.room{margin:0 var(--padx-r) 0 var(--padx-l);border-radius:28px;height:clamp(170px,30vh,250px);background-size:64px 64px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:16px;box-shadow:0 6px 0 var(--line-d);position:relative;overflow:hidden;flex:none}
.room .tagline{position:absolute;top:10px;right:12px;background:#fff;border-radius:999px;padding:3px 12px;font:500 14px var(--font-body);box-shadow:0 3px 0 var(--line-d)}
.heartfx{position:absolute;pointer-events:none;color:var(--berry);font:800 28px var(--font-body);animation:rise 1s ease-out forwards}
.tabs{display:flex;gap:8px;padding-top:12px;padding-bottom:8px}
.tabs button{flex:1;border:0;border-radius:16px;padding:10px 6px;background:#fff;font:400 17px var(--font-display);color:var(--ink);box-shadow:0 4px 0 var(--line-d);min-height:44px}
.tabs button[aria-selected="true"]{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-d)}
.shop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;overflow:auto;flex:1;align-content:start;padding-bottom:16px;padding-top:2px}
.item{background:#fff;border:3px solid transparent;border-radius:20px;box-shadow:0 4px 0 var(--line-d);padding:8px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:112px;justify-content:space-between}
.item.on{border-color:var(--leaf)}
.item .ic{width:54px;height:46px;display:flex;align-items:center;justify-content:center}
.item .ic svg,.item .ic img{max-width:100%;max-height:100%;display:block}
.item .nm{font:700 14px var(--font-body);text-align:center}
.item .pr{display:flex;align-items:center;gap:4px;font:800 15px var(--font-body);background:var(--paper);border-radius:999px;padding:2px 10px 2px 8px}
.item .pr img{width:18px;height:18px}
.item .pr.own{background:#DFF5E3;color:var(--leaf-d)}
.item .pr.eq{background:var(--leaf);color:#fff}
.item.poor{opacity:.6}
.moodbar{position:absolute;top:10px;left:12px;display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:3px 10px 3px 6px;box-shadow:0 3px 0 var(--line-d);z-index:2}
.moodbar b{font-size:18px;line-height:1}
.moodbar i{display:block;width:64px;height:9px;border-radius:9px;background:var(--line);overflow:hidden}
.moodbar u{display:block;height:100%;background:linear-gradient(90deg,#FFC940,#4CBF5F);transition:width .3s}
.pet{cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
.pet.jump{animation:hop .5s}
.pet.chew .av{animation:chew .7s}
.pet.over .av{filter:drop-shadow(0 0 12px #FFC940)}
@keyframes chew{0%,100%{transform:scale(1)}25%{transform:scale(1.08,.93)}50%{transform:scale(.96,1.05)}75%{transform:scale(1.06,.95)}}
.petheart{position:fixed;pointer-events:none;font-size:22px;animation:rise .9s ease-out forwards;z-index:60}
.food-ghost{position:fixed;z-index:200;font-size:48px;pointer-events:none;transform:translate(-50%,-60%)}
#shop .item[data-act=food]{touch-action:none}
.item.want{border-color:var(--sun);box-shadow:0 0 0 3px #FFE7A3,0 4px 0 var(--line-d)}
.item .wtag{position:absolute;top:6px;right:6px;background:var(--sun);color:var(--ink);font:800 11px var(--font-body);border-radius:99px;padding:1px 7px}
.item .wtag.fav{background:#FFE0E6;padding:1px 5px}
.map-av .map-pet{pointer-events:auto;cursor:pointer}
.map-av .map-pet.jump{animation:hop .5s}
.map-av .bubble{white-space:normal;width:max-content;max-width:190px;text-align:center}
.item{position:relative}
.item .fem{font-size:38px;line-height:1}
.item .sw{display:block;width:46px;height:46px;border-radius:12px;box-shadow:inset 0 0 0 2px rgba(31,43,71,.1)}
.item .gr{position:absolute;top:6px;left:6px;background:var(--leaf);color:#fff;font:800 12px var(--font-body);border-radius:99px;padding:1px 7px}

/* parent settings */
#sc-parent{background:#EEF3FA}
.set-scroll{overflow:auto;flex:1;padding-bottom:30px;display:flex;flex-direction:column;gap:14px;-webkit-user-select:text;user-select:text}
.card{background:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 3px 0 var(--line-d);display:flex;flex-direction:column;gap:12px}
.card h3{margin:0;font:400 20px var(--font-display);color:var(--blue-d)}
.card p.hint{margin:0;font:400 14px/1.45 var(--font-body);color:var(--ink2)}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.field>label,.field>span.lb{font:500 16px var(--font-body);flex:1;min-width:130px}
input[type=number],input[type=text],select{font:500 18px var(--font-body);border:2px solid var(--line-d);border-radius:12px;padding:8px 10px;min-height:44px;background:#fff;color:var(--ink);width:96px;box-sizing:border-box;text-align:center}
input[type=text]{width:100%;max-width:180px;text-align:right}
select{width:auto;min-width:130px;text-align:right}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font:500 16px var(--font-body);padding:2px 0;cursor:pointer}
.chk input{width:24px;height:24px;accent-color:var(--blue);flex:none;margin:0}
.chk small{display:block;color:var(--ink2);font:400 13px var(--font-body)}
.chkgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
@media (max-width:420px){.chkgrid{grid-template-columns:1fr}}
.samples{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font:500 15px var(--font-body)}
.samples li{background:var(--paper);border-radius:10px;padding:6px 10px;display:flex;gap:8px;justify-content:space-between}
.samples li b{color:var(--blue-d);font-weight:700;white-space:nowrap}
.samples li span{direction:ltr;unicode-bidi:plaintext}
.shp{width:clamp(64px,22vw,92px);height:clamp(64px,22vw,92px);display:block}
.skills{display:flex;flex-direction:column;gap:10px}
.skill{background:var(--paper);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:5px}
.skill .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font:700 15px var(--font-body)}
.skill .bar{height:10px;border-radius:99px;background:#fff;overflow:hidden}
.skill .bar i{display:block;height:100%;border-radius:99px}
.skill .meta{font:400 13px var(--font-body);color:var(--ink2)}
.tag{font:700 12px var(--font-body);border-radius:99px;padding:2px 9px;white-space:nowrap}
.tag.good{background:#DDF5E1;color:#1E7A30}.tag.mid{background:#FFF1C9;color:#8A6300}.tag.weak{background:#FFE0E6;color:#A2213F}.tag.new{background:#E6EEF8;color:#4A5B7A}
.reco{background:#EEF6FF;border-radius:12px;padding:8px 12px;font:500 14px/1.5 var(--font-body)}

/* reading */
.hw{font-family:'Noto Sans Hebrew','Rubik',sans-serif;font-weight:500;direction:rtl;unicode-bidi:isolate}
.opt .hw{font-size:clamp(30px,9vw,42px);line-height:1.35}
.pic{font-size:clamp(80px,24vw,118px);line-height:1.1}
.pic.sm{font-size:clamp(46px,13vw,62px)}
.rsent{font:500 clamp(28px,8.5vw,40px)/1.7 'Noto Sans Hebrew','Rubik',sans-serif;direction:rtl;text-align:center}
.blank{display:inline-block;min-width:2.4em;height:.9em;border-bottom:4px dashed var(--berry);margin:0 .25em;vertical-align:baseline}
.rtarget .hw{font-size:clamp(46px,14vw,64px);background:var(--paper);border-radius:18px;padding:4px 22px}
.slots{display:flex;gap:8px;direction:rtl;justify-content:center}
.slot{min-width:66px;height:62px;border-radius:14px;border:3px dashed var(--line-d);display:flex;align-items:center;justify-content:center;padding:0 6px}
.slot .hw{font-size:32px}
.slot.filled{border-style:solid;border-color:var(--leaf);background:#DFF5E3;animation:pop .3s ease-out}
.slot{transition:transform .12s,background .12s}
.slot.over{border-color:var(--sun);border-style:solid;background:#FFF6D6;transform:scale(1.08)}
.opt.dragable{touch-action:none;cursor:grab}
.opt.dragging{opacity:.3}
.drag-ghost{position:fixed;z-index:200;pointer-events:none;margin:0;box-sizing:border-box;transform:scale(1.1) rotate(-4deg);box-shadow:0 12px 22px rgba(31,43,71,.3);border-color:var(--sun)}
.opt.used{opacity:.3}
.rmiss{display:flex;align-items:center;justify-content:center;direction:rtl;font:500 clamp(42px,13vw,60px)/1.5 'Noto Sans Hebrew','Rubik',sans-serif}
.rmiss .hw{font-size:inherit}
.slot.inl{min-width:1.05em;height:1.3em;margin:0 .08em;padding:0 .05em;border-width:3px;font-size:inherit;border-color:var(--sun);background:#FFF8DD}
.slot.inl .hw{font-size:inherit}
.slot.inl .hint{color:#B9C7D8}
.slot.inl.over{background:#FFE9A8}
.tracecv{display:block;background:#fff;border-radius:22px;box-shadow:inset 0 0 0 3px var(--line);touch-action:none;cursor:crosshair}
.opt.trace-clear{grid-column:1/-1;font:400 22px var(--font-display);min-height:56px}
.opt[hidden]{display:none}
.hl{font:700 clamp(42px,12vw,58px)/1 'Noto Sans Hebrew','Rubik',sans-serif}
.bigspk{width:104px;height:104px;border-radius:50%;border:0;background:var(--blue);font-size:48px;box-shadow:0 7px 0 var(--blue-d);padding:0}
.bigspk:active{transform:translateY(4px);box-shadow:0 3px 0 var(--blue-d)}
.trk-tabs{display:flex;gap:8px;margin-top:8px}
.trk-tabs[hidden]{display:none}
.trk-tabs button{flex:1;border:0;border-radius:14px;padding:8px 6px;min-height:42px;background:var(--paper);color:var(--ink2);font:400 18px var(--font-display);box-shadow:0 3px 0 var(--line-d)}
.trk-tabs button[aria-selected="true"]{background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue-d)}

/* reward boxes */
#sc-box{align-items:center;justify-content:center;gap:10px;overflow:hidden;background:radial-gradient(circle at 50% 45%,#3B5BA8 0,#1E2A57 60%,#141B3A 100%)}
#sc-box.box-big{background:radial-gradient(circle at 50% 45%,#4C8C9E 0,#1F3F57 60%,#13253A 100%)}
#sc-box.box-mega{background:radial-gradient(circle at 50% 45%,#8E4CE0 0,#3D1C78 60%,#220F45 100%)}
.box-rays{position:absolute;left:50%;top:45%;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(rgba(255,255,255,.09) 0 10deg,transparent 10deg 20deg);animation:spin 16s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.box-top{position:relative;text-align:center;min-height:74px}
.box-top h2{margin:0;font:400 34px var(--font-display);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.box-top p{margin:4px 0 0;font:600 18px var(--font-body);color:#FFE27A}
.boxbtn{position:relative;border:0;background:transparent;padding:0;width:230px;height:196px;animation:boxbob 1.6s ease-in-out infinite;filter:drop-shadow(0 0 22px rgba(255,226,122,.45))}
.boxbtn svg{width:100%;height:100%;display:block}
.boxbtn.shake{animation:boxshake .35s}
@keyframes boxbob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.03)}}
@keyframes boxshake{0%,100%{transform:rotate(0) scale(1.05)}25%{transform:rotate(-8deg) scale(1.12)}75%{transform:rotate(8deg) scale(1.12)}}
.box-taps{position:relative;display:flex;gap:8px;min-height:16px}
.box-taps i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.25)}
.box-taps i.on{background:#FFC940;box-shadow:0 0 8px #FFC940}
.bx-p{position:absolute;pointer-events:none;transform:translate(-50%,-50%);animation:burst .85s ease-out forwards;z-index:5}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2) rotate(120deg)}}
.box-reveal{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer}
.box-reveal[hidden],.box-sum[hidden],.boxbtn[hidden]{display:none}
.loot-card{position:relative;width:230px;padding:26px 14px 16px;border-radius:26px;background:#fff;display:flex;flex-direction:column;align-items:center;gap:8px;animation:cardin .45s cubic-bezier(.2,1.6,.4,1);box-shadow:0 0 0 5px var(--rc),0 0 40px var(--rc)}
.loot-card.r0{--rc:#2FA0EA}.loot-card.r1{--rc:#4CBF5F}.loot-card.r2{--rc:#D64FB0}.loot-card.r3{--rc:#FFC940}
@keyframes cardin{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
.lc-gem{position:absolute;top:-20px;width:44px}
.lc-icon{min-height:84px;display:flex;align-items:center;justify-content:center}
.lc-icon img{width:72px;height:72px;object-fit:contain}
.lc-icon .lc-mon{width:90px;height:90px}
.lc-em{font-size:66px;line-height:1}
.lc-svg{display:block;width:96px}.lc-svg svg{width:100%;height:auto;display:block}
.lc-icon .sw{display:block;width:72px;height:72px;border-radius:16px}
.lc-name{font:700 20px var(--font-body);text-align:center}
.lc-rar{font:800 13px var(--font-body);color:#fff;background:var(--rc);border-radius:99px;padding:2px 12px}
.lc-count{margin:0;color:#fff;font:600 15px var(--font-body)}
.box-sum{position:relative;background:#fff;border-radius:24px;padding:16px;width:88%;max-width:380px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;animation:cardin .4s ease-out}
.box-sum h3{margin:0;text-align:center;font:400 24px var(--font-display);color:var(--blue-d)}
.sum-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sum-it{border-radius:16px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--paper);box-shadow:inset 0 0 0 3px var(--rc)}
.sum-it.r0{--rc:#9CD1F7}.sum-it.r1{--rc:#9BE2A7}.sum-it.r2{--rc:#F0A8DC}.sum-it.r3{--rc:#FFD966}
.sum-it .lc-icon{min-height:56px}.sum-it .lc-icon img{width:48px;height:48px}.sum-it .lc-em{font-size:42px}.sum-it .lc-svg{width:60px}.sum-it .lc-icon .sw{width:48px;height:48px}.sum-it .lc-mon{width:56px;height:56px}
.sum-it small{font:600 13px var(--font-body);text-align:center}
.boxgo{animation:pulse2 1.2s ease-in-out infinite}
@keyframes pulse2{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.lootmini{display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center;overflow:hidden}
.lootmini img{width:26px;height:26px;object-fit:contain}.lootmini .lc-em{font-size:22px}.lootmini .lc-svg{width:28px}.lootmini .av{--s:28px!important}.lootmini .sw{width:24px;height:24px;border-radius:6px}
.stk.mon .mstk{width:64px;height:64px;object-fit:contain}
.stk.mon.miss .mstk{filter:brightness(0);opacity:.15}
.album-note{grid-column:1/-1;margin:0;font:500 14px var(--font-body);color:var(--ink2);text-align:center}

/* map dock */
.map-foot{flex-direction:column;gap:10px;padding-top:8px}
.dock{display:flex;gap:6px;justify-content:space-between}
.dock button{position:relative;flex:1;border:0;background:var(--paper);border-radius:14px;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font:500 12px var(--font-body);color:var(--ink);box-shadow:0 3px 0 var(--line-d);min-height:48px}
.dock button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line-d)}
.dock .de{font-size:22px;line-height:1.1}
.dbadge{position:absolute;top:-5px;left:4px;min-width:18px;height:18px;border-radius:9px;background:var(--berry);color:#fff;font:800 12px/18px var(--font-body);font-style:normal;text-align:center;padding:0 4px;box-sizing:border-box}
.dbadge[hidden]{display:none}
.surp{position:absolute;transform:translate(-50%,-50%);border:0;background:#fff;border-radius:50%;width:46px;height:46px;font-size:26px;line-height:46px;padding:0;box-shadow:0 4px 0 var(--line-d);z-index:2;animation:bob 1.8s ease-in-out infinite}
.surp.locked{filter:grayscale(1);opacity:.55;animation:none}
.node .mini-mon{position:absolute;width:40px;height:40px;left:50%;top:-30px;transform:translateX(-50%);pointer-events:none}

/* friend speech */
#lv-av{position:relative}
.pips[hidden]{display:none}
.say{position:absolute;top:calc(100% + 6px);left:0;z-index:20;background:#fff;color:var(--ink);border-radius:14px;padding:5px 11px;font:700 15px var(--font-body);white-space:nowrap;box-shadow:0 3px 0 var(--line-d)}
.say::before{content:'';position:absolute;top:-6px;left:18px;border:6px solid transparent;border-top:0;border-bottom-color:#fff}
.say.in{animation:pop .35s ease-out}
.say[hidden]{display:none}
.room .say{top:auto;bottom:calc(100% - 60px);left:50%;transform:translateX(-50%)}
.room .say::before{display:none}
.room .say.in{animation:none}

/* boss */
.boss-strip{display:flex;align-items:center;gap:10px;padding-top:2px}
.boss-strip[hidden]{display:none}
.mon{width:64px;height:64px;flex:none}
.mon svg{width:100%;height:100%;display:block}
.mon.hit{animation:hit .45s}
.mon.atk{animation:atk .45s}
.mon.dead{animation:dead .7s forwards}
@keyframes hit{0%,100%{transform:none;filter:none}30%{transform:translateX(8px) rotate(8deg);filter:brightness(1.8)}60%{transform:translateX(-5px)}}
@keyframes atk{0%,100%{transform:none}40%{transform:scale(1.25) translateX(10px)}}
@keyframes dead{to{transform:scale(0) rotate(200deg);opacity:0}}
.bossinfo{flex:1;display:flex;flex-direction:column;gap:4px}
.bossinfo b{font:400 17px var(--font-display);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.hp{height:14px;border-radius:99px;background:rgba(255,255,255,.7);overflow:hidden;box-shadow:inset 0 0 0 2px rgba(31,43,71,.2)}
.hp i{display:block;height:100%;background:var(--berry);border-radius:99px;transition:width .35s}
.dmg{position:absolute;z-index:9;font:800 26px var(--font-body);color:var(--berry-d);animation:rise .8s ease-out forwards;pointer-events:none}

/* result extras */
.res-extra{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.res-extra:empty{display:none}
.rx{background:var(--paper);border-radius:14px;padding:6px 10px;font:600 15px var(--font-body);display:flex;align-items:center;gap:6px;animation:pop .45s ease-out both}
.rx .em{font-size:26px}

/* album */
#album-tabs{gap:5px}
#album-tabs button{font-size:14px;padding:6px 2px;line-height:1.2}
.album{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;overflow:auto;flex:1;align-content:start;padding-bottom:16px;padding-top:4px}
.stk{background:#fff;border-radius:18px;border:3px solid var(--line);box-shadow:0 4px 0 var(--line-d);min-height:108px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;padding:6px}
.stk .em{font-size:44px;line-height:1.1}
.stk .nm{font:700 13px var(--font-body);text-align:center}
.stk.r1{border-color:#7CC4F5}.stk.r2{border-color:var(--sun);background:#FFFBEA}
.stk.miss .em{filter:grayscale(1) brightness(0);opacity:.13}
.stk .cnt{position:absolute;top:4px;left:6px;font:800 12px var(--font-body);color:var(--ink2)}
.stk .rr{font:600 11px var(--font-body);color:var(--ink2)}
.album-done{grid-column:1/-1;background:#DFF5E3;color:var(--leaf-d);border-radius:14px;padding:8px;text-align:center;font:700 15px var(--font-body)}

/* achievements */
.achs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;overflow:auto;flex:1;align-content:start;padding-bottom:16px;padding-top:4px}
.ach{background:#fff;border-radius:18px;box-shadow:0 4px 0 var(--line-d);padding:10px;display:flex;gap:10px;align-items:center}
.ach .em{font-size:34px;flex:none}
.ach b{display:block;font:700 15px var(--font-body)}
.ach small{display:block;font:400 13px var(--font-body);color:var(--ink2)}
.ach.off .em{filter:grayscale(1);opacity:.35}
.ach.off b{color:var(--ink2)}

/* games */
.games{display:flex;flex-direction:column;gap:12px;overflow:auto;flex:1;padding-bottom:16px}
.game{background:#fff;border-radius:22px;box-shadow:0 5px 0 var(--line-d);padding:14px;display:flex;gap:12px;align-items:center}
.game .em{font-size:46px;flex:none}
.game .tx{flex:1}
.game .tx b{display:block;font:400 20px var(--font-display)}
.game .tx small{display:block;font:400 14px/1.4 var(--font-body);color:var(--ink2)}
.games .hint{font:500 14px/1.5 var(--font-body);color:var(--ink2);background:#fff;border-radius:14px;padding:10px 12px;margin:0}
.mini-help{margin:0 0 8px;text-align:center;font:600 16px var(--font-body);color:var(--ink2)}
.mini-board{flex:1;position:relative;min-height:0;margin-bottom:max(14px, env(safe-area-inset-bottom, 0px))}
.mem{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;height:100%;align-content:center}
.mcard{border:0;border-radius:18px;min-height:clamp(70px,13vh,104px);background:var(--blue);box-shadow:0 5px 0 var(--blue-d);font:800 36px var(--font-body);color:#fff;display:flex;align-items:center;justify-content:center;padding:6px}
.mcard.up,.mcard.done{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line-d)}
.mcard.done{background:#DFF5E3;box-shadow:0 5px 0 var(--leaf-d)}
.mem.big{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mcard{background:linear-gradient(135deg,#2FA0EA,#1B6DB3)}
.mcard.up,.mcard.done{background:#fff}
.mcard.done{background:#DFF5E3}
.mback{font-size:34px;color:#FFC940;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.mcard{min-height:clamp(84px,15vh,124px)}
.mem.big .mcard{min-height:clamp(72px,12vh,104px)}
.mcard .shp{width:min(72px,85%);height:auto}
.mcard .av{--s:min(60px,16vw)!important}
.mnum{display:flex;align-items:center;justify-content:center;width:58px;height:58px;border-radius:50%;color:#fff;font:800 36px var(--font-body);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.memo{font-size:52px;line-height:1}
.mem.big .mnum{width:48px;height:48px;font-size:30px}
.mem.big .memo{font-size:44px}
.mem.huge{gap:6px;align-content:stretch}
.mem.huge .mcard{min-height:0;padding:2px;border-radius:14px}
.mem.huge .mnum{width:40px;height:40px;font-size:24px}
.mem.huge .memo{font-size:34px}
.mem.huge .av{--s:min(46px,12vw)!important}
.mem.huge .shp{width:min(52px,80%)}
.mcard.up{animation:pop .25s ease-out}
.balloon{position:absolute;transform:translate(-50%,-50%);border:0;width:68px;height:82px;border-radius:50% 50% 48% 48%;font:800 28px var(--font-body);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2);box-shadow:inset -8px -10px 0 rgba(0,0,0,.12);animation:float 2.4s ease-in-out infinite;padding:0}
.balloon::after{content:'';position:absolute;left:50%;top:100%;width:2px;height:26px;background:rgba(31,43,71,.35)}
.balloon.pop{animation:popb .3s forwards}
.balloon.no{animation:shake .4s}
@keyframes float{0%,100%{margin-top:0}50%{margin-top:-10px}}
@keyframes popb{to{transform:translate(-50%,-50%) scale(1.6);opacity:0}}
.mini-end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.mini-end h3{margin:0;font:400 30px var(--font-display);color:var(--blue-d)}
.mini-end p{margin:0;font:700 18px var(--font-body)}
#sc-mini .topbar h2{font-size:18px;padding:8px 14px;white-space:nowrap}
#sc-mini .topbar .pill{white-space:nowrap;font-size:15px}
.race{display:flex;flex-direction:column;height:100%;gap:8px}
.rtrack{flex:0 0 44%;position:relative;border-radius:20px;overflow:hidden;background-size:64px 64px;box-shadow:0 5px 0 var(--line-d)}
.rroad{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(74%,250px);background:#A3C6C9}
.rroad::before,.rroad::after{content:'';position:absolute;top:0;bottom:0;width:8px;background:repeating-linear-gradient(to bottom,#E8681A 0 14px,#fff 14px 28px)}

/* ---------- difficulty ---------- */
function rampLevels(){return S.set.perWorld*({fast:.75,normal:1.5,slow:3}[S.set.ramp]||1.5)}
function levelParams(g){
  var c=S.set,N=c.perWorld,t=Math.min(1,g/rampLevels()),boss=(g%N)===N-1;
  return {g:g,t:t,boss:boss,cap:capFor(t),
    q:Math.round(c.qStart+(c.qEnd-c.qStart)*t)+(boss?2:0),
    hearts:Math.max(1,Math.round(c.heartsStart+(c.heartsEnd-c.heartsStart)*t))};
}
function capFor(t){var c=S.set,minCap=Math.min(5,c.max);return Math.round(minCap+(c.max-minCap)*t)}

/* ---------- learning: per-topic stats & adaptive difficulty ---------- */
// b = how far this topic is shifted from the journey's base difficulty (negative = easier, positive = harder)
var B_MIN=-.35,B_MAX=.6,REC_N=20,FAST_MS=7000;
function stat(type){var st=S.stats[type];if(!st)st=S.stats[type]={n:0,ok:0,rec:[],ms:0,b:0};return st}
function recordAnswer(type,ok,ms){
  var st=stat(type);st.n++;if(ok)st.ok++;
  st.rec.push(ok?1:0);if(st.rec.length>REC_N)st.rec=st.rec.slice(-REC_N);
  if(ok){st.ms=st.ms?Math.round(st.ms*.8+ms*.2):ms;st.b+=ms<FAST_MS?.05:.02}
  else st.b-=.08;
  st.b=clamp(st.b,B_MIN,B_MAX);
  save();
}
function recAcc(st){if(!st||!st.rec.length)return 0;var s=0;st.rec.forEach(function(x){s+=x});return s/st.rec.length}
function skillLevel(type){
  var st=S.stats[type];if(!st||st.rec.length<5)return 'new';
  var a=recAcc(st);
  if(a>=.9&&st.rec.length>=8)return 'good';
  if(a<.7)return 'weak';
  return 'mid';
}
var SKILL_W={new:1,good:.6,mid:1.2,weak:2.2};
function typeParams(p,type){
  if(!S.set.adapt)return p;
  var b=(S.stats[type]&&S.stats[type].b)||0,t=clamp(p.t+b,0,1);
  return {g:p.g,t:t,boss:p.boss,cap:capFor(t),q:p.q,hearts:p.hearts};
}

function dotsHTML(n,item,size,gone){

  for(var i=0;i<n;i++)s+='<i class="'+cls+(gone&&i>=n-gone?' gone':'')+'"></i>';
  return s+'</div>';
}
function numOpts(ans,extra){
  var pool=[ans-1,ans+1,ans-2,ans+2,ans+3,ans-3].concat(extra||[]);
  var seen={};seen[ans]=1;var d=[];
  shuffle(pool).forEach(function(v){if(v>=0&&!seen[v]&&d.length<3){seen[v]=1;d.push(v)}});
  var k=4;while(d.length<3){var v=ans+k++;if(!seen[v]){seen[v]=1;d.push(v)}}
  return shuffle([ans].concat(d)).map(function(v){return {value:v,html:String(v)}});
}

/* ---------- generators ---------- */
function gCount(p){
  var n=rnd(1,Math.min(Math.max(p.cap,3),20)),it=pick(ITEMS);

}
function gVCompare(p){
  var K=clamp(p.cap,5,12),nums=shuffle(Array.apply(null,Array(K)).map(function(_,i){return i+1})).slice(0,4);
  var most=Math.random()<.6,target=most?Math.max.apply(null,nums):Math.min.apply(null,nums),it=pick(ITEMS);
  return {type:'vcompare',layout:'grp',prompt:most?'איפה יש הכי הרבה?':'איפה יש הכי מעט?',say:most?'איפה יש הכי הרבה?':'איפה יש הכי מעט?',text:(most?'הכי הרבה: ':'הכי מעט: ')+nums.join(', '),
    options:nums.map(function(n){return {value:n,html:dotsHTML(n,it,'small')}}),answer:target,key:'v'+nums.join('')+most};
}

// each friend's favourite food
var FAV={elephant:'watermelon',giraffe:'apple',hippo:'watermelon',monkey:'banana',panda:'cookie',parrot:'strawberry',penguin:'icecream',pig:'cake',rabbit:'carrot',snake:'cheese',blue:'donut',green:'pizza',pink:'icecream',purple:'cake',red:'burger'};

function food(id){return FOODS.filter(function(f){return f.id===id})[0]}
function mood(id){ // happiness 0-100 for a friend; slowly drops with time away
  id=id||S.avatar;var m=S.mood[id];if(!m)m=S.mood[id]={h:70,t:Date.now(),want:null};
  var hrs=(Date.now()-m.t)/3600000;if(hrs>.05){m.h=Math.max(0,m.h-hrs*.8);m.t=Date.now()}
  return m;
}
function addJoy(n,id){var m=mood(id);m.h=clamp(m.h+n,0,100);save()}
function moodFace(h){return h>=75?'😄':h>=45?'🙂':h>=20?'😐':'😢'}
function nameBit(){return S.name?' '+S.name:''}
function timeHello(){var hr=new Date().getHours();return (hr>=5&&hr<12?'בוקר טוב':hr>=12&&hr<17?'צהריים טובים':hr>=17&&hr<21?'ערב טוב':'לילה טוב')+nameBit()+'!'}
function wantFood(){ // when hungry the friend asks for one particular food, sometimes his favourite
  var m=mood();if(S.hunger<3){if(m.want){m.want=null;save()}return null}
  if(!m.want){var opts=FOODS.filter(function(f){return f.price<=40});m.want=Math.random()<.3&&FAV[S.avatar]?FAV[S.avatar]:pick(opts).id;save()}
  return food(m.want);
}
function petJoy(n){ // touch makes the friend happier, up to 15 points a day
  var d=dstr();if(!S.pet||S.pet.d!==d)S.pet={d:d,n:0};
  if(S.pet.n<15){S.pet.n+=n;addJoy(n)}

function petTap(){
  var p=$('#pet');if(!p)return;petJump(p);

  var r=p.getBoundingClientRect();petHeart(r.left+r.width/2,r.top+20);

function overPet(x,y){var p=$('#pet');if(!p)return false;var r=p.getBoundingClientRect();return x>r.left-24&&x<r.right+24&&y>r.top-24&&y<r.bottom+24}
var PET=null,FD=null;
document.addEventListener('pointerdown',function(e){
  if($('#sc-home').hidden)return;
  if(e.target.closest('#pet')){PET={id:e.pointerId,lx:e.clientX,ly:e.clientY,dist:0,stroked:false};return}
  var it=e.target.closest('#shop .item[data-act=food]');
  if(it)FD={k:it.getAttribute('data-k'),x:e.clientX,y:e.clientY,id:e.pointerId,g:null};
});
document.addEventListener('pointermove',function(e){
  if(PET&&e.pointerId===PET.id){PET.dist+=Math.abs(e.clientX-PET.lx)+Math.abs(e.clientY-PET.ly);PET.lx=e.clientX;PET.ly=e.clientY;
    if(PET.dist>30&&Math.random()<.25)petHeart(e.clientX,e.clientY);
    if(PET.dist>140&&!PET.stroked){PET.stroked=true;petStroke()}}
  if(FD&&e.pointerId===FD.id){
    if(!FD.g){var dx=e.clientX-FD.x,dy=e.clientY-FD.y;if(dx*dx+dy*dy<100)return;
      FD.g=document.createElement('div');FD.g.className='food-ghost';FD.g.textContent=food(FD.k).e;document.body.appendChild(FD.g)}
    FD.g.style.left=e.clientX+'px';FD.g.style.top=e.clientY+'px';
    var p=$('#pet');if(p)p.classList.toggle('over',overPet(e.clientX,e.clientY));
  }
});
function endPetDrag(e,drop){
  if(PET&&e.pointerId===PET.id){var pt=PET;PET=null;if(drop&&!pt.stroked&&pt.dist<12)petTap()}
  if(FD&&e.pointerId===FD.id){var d=FD;FD=null;if(!d.g)return;d.g.remove();var p=$('#pet');if(p)p.classList.remove('over');
    dragSuppress=true;setTimeout(function(){dragSuppress=false},0); // the click after a drag isn't a tap
    if(!drop)return;
    if(overPet(e.clientX,e.clientY))homeAct('food',d.k);else toast('גררו את האוכל אל החבר 😋');
  }
}

var STARTERS=['panda','rabbit','elephant','penguin','blue'];
var MAX_TICKETS=5;
function addStarters(){STARTERS.forEach(function(id){if(S.friends.indexOf(id)<0)S.friends.push(id)})} // the five starter friends are always open
function friendOpen(id){return S.friends.length?S.friends.indexOf(id)>=0:STARTERS.indexOf(id)>=0}
function friendName(id){var a=AVATARS.filter(function(x){return x.id===id})[0];return a?a.name:''}
function growth(){return S.growthBy[S.avatar]||0}
function baseWorld(g){return Math.floor(g/S.set.perWorld)%WORLDS.length}
function curBase(){return baseWorld(S.done)}
function albumIds(b){var a=[];for(var i=b*6;i<b*6+6;i++)a.push(i);return a}
function distinctStickers(){return Object.keys(S.stickers).length}
function albumFull(b){return albumIds(b).every(function(i){return S.stickers[i]})}
function anyAlbumFull(){for(var b=0;b<WORLDS.length;b++)if(albumFull(b))return true;return false}
function giveSticker(b,minRare){
  var ids=albumIds(b),r=Math.random(),rar=Math.max(r<.07?2:r<.27?1:0,minRare||0);
  var pool=ids.filter(function(i){return STICKERS[i][2]===rar}),miss=pool.filter(function(i){return !S.stickers[i]});
  var id=miss.length&&(minRare||Math.random()<.65)?pick(miss):pick(pool);
  var dup=!!S.stickers[id],wasFull=albumFull(b);
  S.stickers[id]=(S.stickers[id]||0)+1;
  if(dup)S.coins+=2;
  if(!wasFull&&albumFull(b)){S.coins+=20;toast('🎉 השלמת את אלבום '+WORLDS[b].name+'! +20 מטבעות')}
  return {id:id,dup:dup};
}
function unlockFriend(){
  var locked=AVATARS.filter(function(a){return S.friends.indexOf(a.id)<0});
  if(!locked.length)return null;
  var a=pick(locked);S.friends.push(a.id);return a.id;
}

// The dotted guide comes from the font itself: the glyph is drawn on a small grid, thinned to a one-pixel

/* ---------- fair answer placement ---------- */
// keeps the correct answer's position balanced within a level without a predictable cycle
function placeAnswer(q){
  if(q.layout==='g3'||q.seq||q.trace)return; // the > < = keypad and syllable tiles keep their own order
  var n=q.options.length;if(!L.posCnt)L.posCnt=[];

  var min=Math.min.apply(null,L.posCnt.slice(0,n)),cand=[];
  var tri=L.lastPos>=0&&L.lastPos===L.prevPos?L.lastPos:-1; // never three in a row
  for(var j=0;j<n;j++)if(L.posCnt[j]<=min+1&&j!==tri)cand.push(j);
  if(!cand.length)for(var k=0;k<n;k++)if(k!==tri)cand.push(k);
  var pos=pick(cand),cur=0;
  for(var m=0;m<n;m++)if(q.options[m].value===q.answer)cur=m;
  var t=q.options[pos];q.options[pos]=q.options[cur];q.options[cur]=t;

  var p=typeParams(levelParams(S.done),type);
  if(type==='shape')return p.t<.3?'צורות בסיסיות':p.t>.65?'צורות דומות, מסובבות':'כל הצורות, עם צורה דומה';
  if(type==='mul'||type==='div')return 'לוח הכפל עד '+factorMax(p);
  if(type==='tens')return 'מספרים עד '+Math.min(Math.max(p.cap,20),99);
  return 'מספרים עד '+Math.max(p.cap,type==='count'?3:5);
}
function skillsHTML(){
  var keys=Object.keys(TYPEDESC).concat(S.set.read?Object.keys(RTYPEDESC):[]).filter(function(k){return S.set.types[k]||S.set.rtypes[k]||(S.stats[k]&&S.stats[k].n)});
  var good=[],weak=[],h='';
  keys.forEach(function(k){
    var st=S.stats[k],lv=skillLevel(k),acc=Math.round(recAcc(st)*100);
    if(lv==='good')good.push(DESC(k)[0]);if(lv==='weak')weak.push(DESC(k)[0]);
    var meta=st&&st.n?st.n+' תרגילים · '+acc+'% הצלחה בניסיון ראשון (מתוך '+st.rec.length+' אחרונים)'+(st.ms?' · זמן ממוצע '+(st.ms/1000).toFixed(1)+' שנ׳':''):'עוד לא תורגל';
    if(S.set.adapt)meta+=' · רמה נוכחית: '+diffLabel(k);
    h+='<div class="skill"><div class="top"><span>'+esc(DESC(k)[0])+(S.set.types[k]||S.set.rtypes[k]?'':' (כבוי)')+'</span><span class="tag '+lv+'">'+SKILL_TXT[lv]+'</span></div>'+
      '<div class="bar"><i style="width:'+(st&&st.rec.length?Math.max(4,acc):0)+'%;background:'+SKILL_COL[lv]+'"></i></div><div class="meta">'+meta+'</div></div>';
  });
  var reco='';
  if(good.length)reco+='<b>חזק/ה ב:</b> '+esc(good.join(', '))+(S.set.adapt?' — התרגילים בנושאים האלה נעשים קשים יותר ומופיעים פחות.':'.')+'<br>';
  if(weak.length)reco+='<b>צריך חיזוק ב:</b> '+esc(weak.join(', '))+(S.set.adapt?' — יופיעו יותר תרגילים כאלה, ברמה נוחה יותר עד שיתחזק.':'.');
  var capped=keys.some(function(k){return skillLevel(k)==='good'&&['count','vcompare','ncompare','sign','order','add','sub','missing'].indexOf(k)>=0&&typeParams(levelParams(S.done),k).cap>=S.set.max});
  if(capped)reco+='<br><b>שימו לב:</b> בחלק מהנושאים החזקים כבר הגענו למספר המקסימלי ('+S.set.max+'). כדי לאתגר יותר, הגדילו את "מספר מקסימלי" בכרטיס "טווח המספרים".';
  if(!reco)reco='המערכת לומדת מכל תשובה. אחרי כמה שלבים יופיע כאן סיכום של הנושאים החזקים והחלשים.';
  return '<div class="reco">'+reco+'</div><div class="skills">'+h+'</div>';
}

function onSetChange(e){
  var t=e.target;
  if(t.hasAttribute('data-set')){var k=t.getAttribute('data-set'),v=parseInt(t.value,10);if(isNaN(v))v=DEF[k];v=clamp(v,LIM[k][0],LIM[k][1]);t.value=v;S.set[k]=v}
  else if(t.hasAttribute('data-type')){S.set.types[t.getAttribute('data-type')]=t.checked?1:0;if(!Object.keys(S.set.types).some(function(x){return S.set.types[x]})){S.set.types.add=1;renderParent();toast('צריך לפחות סוג אחד של תרגיל')}}
  else if(t.hasAttribute('data-flag')){var fl=t.getAttribute('data-flag');S.set[fl]=t.checked?1:0;
    if(fl==='read'&&!S.set.read)setTrack('math');
    if(/^(adapt|read|finals)$/.test(fl)){save();renderParent();return}}
  else if(t.hasAttribute('data-rtype')){S.set.rtypes[t.getAttribute('data-rtype')]=t.checked?1:0;
    if(!Object.keys(S.set.rtypes).some(function(x){return S.set.rtypes[x]})){S.set.rtypes.rpic=1;toast('צריך לפחות סוג אחד של תרגיל קריאה')}
    save();renderParent();return}
  else if(t.hasAttribute('data-nik')){S.set.nikud[t.getAttribute('data-nik')]=t.checked?1:0;save();renderParent();return}
  else if(t.hasAttribute('data-ramp')){S.set.ramp=t.value}
  else if(t.hasAttribute('data-mem')){S.set.memPairs=+t.value}
  else if(t.hasAttribute('data-name')){S.name=t.value.trim()}
  else return;
  save();
}

function openGate(){
  if(!S.set.gate){openParent();return}
  var a=rnd(6,9),b=rnd(6,9);gateAns=a*b;$('#gate-q').textContent=a+' × '+b+' = ?';$('#gate-in').value='';$('#gate-err').textContent='';openOv('ov-gate');wait(60,function(){try{$('#gate-in').focus()}catch(e){}});
}
function gateOK(){
  if(parseInt($('#gate-in').value,10)===gateAns){closeOv('ov-gate');openParent()}
  else{$('#gate-err').textContent='לא מדויק. נסו שוב.';$('#gate-in').value=''}
}

function flyFlap(){

}
function flyStat(){var f=M.f;$('#mini-stat').textContent='🏔️ '+f.score+' · ⭐ '+f.starsGot}
function flyHitTri(f,ax,ay,bx,by,cx,cy){ // is any point of the plane's (shrunken) outline inside this triangle?
  var rx=27*f.s,ry=19*f.s;
  for(var k=0;k<9;k++){var x=k?f.px+rx*Math.cos(k*Math.PI/4):f.px,y=k?f.py+ry*Math.sin(k*Math.PI/4):f.py;
    var d1=(x-bx)*(ay-by)-(ax-bx)*(y-by),d2=(x-cx)*(by-cy)-(bx-cx)*(y-cy),d3=(x-ax)*(cy-ay)-(cx-ax)*(y-ay);
    if(!((d1<0||d2<0||d3<0)&&(d1>0||d2>0||d3>0)))return true}
  return false;
}
function flyHurt(f){
  if(f.inv>0)return;
  f.lives--;f.inv=1.6;Snd.wrong();
  if(f.lives<=0){flyEnd();return}
  f.vy=-300*f.s;
}
function flyEnd(){
  var f=M.f;M.over=true;cancelAnimationFrame(M.raf);
  var record=f.score>(S.flyBest||0);if(record)S.flyBest=f.score;
  var c=flyCoins(f),medal=f.score>=20?'mg':f.score>=10?'ms':f.score>=5?'mb':null;
  var title=(medal?'<img src="'+FIMG[medal]+'" alt="" style="width:64px;display:block;margin:0 auto 6px">':'')+(f.score>=20?'טייס אלוף!':f.score>=10?'כל הכבוד!':f.score>=5?'יפה מאוד!':f.score?'טיסה טובה!':'ננסה שוב?');
  M.over=false; // let endMini run its own bookkeeping
  endMini(f.score>=3,c,title,'עברת '+(f.score===1?'הר אחד':f.score+' הרים')+' · '+(f.starsGot===0?'לא אספת כוכבים':'אספת '+(f.starsGot===1?'כוכב אחד':f.starsGot+' כוכבים'))+(record?' · שיא חדש! 🏆':''));
}
function flyLoop(ts){
  if(!M||M.over||M.kind!=='fly')return;
  var f=M.f,dt=f.last?Math.min(.033,(ts-f.last)/1000):0;f.last=ts;f.t+=dt;
  var s=f.s,W=f.W,H=f.H,gt=f.groundTop,speed=(130+Math.min(90,f.score*4))*s;
  if(f.started){
    f.vy=Math.min(f.vy+760*s*dt,380*s);f.py+=f.vy*dt; /* gentle gravity with a top fall speed, so the plane glides down */
    if(f.py<20*s){f.py=20*s;f.vy=0}
    if(f.py>gt-18*s){f.py=gt-18*s;flyHurt(f);if(M.over)return}
    if(f.inv>0)f.inv-=dt;
    f.bgX=(f.bgX+speed*.25*dt)%(800*s);f.gX=(f.gX+speed*dt)%(808*s);
    // obstacles: a rock from the ceiling and one from the ground, with a gap to fly through
    var gap=Math.max(165,250-f.score*5)*s,spacing=Math.max(240,300-f.score*3)*s,last=f.obs[f.obs.length-1];
    if(!last||last.x<W-spacing){
      var gy=rnd(Math.round(60*s+gap/2),Math.round(gt-50*s-gap/2)),x=W+20*s;
      f.obs.push({x:x,w:92*s,gy:gy,gap:gap,passed:false});
      f.stars.push({x:x+spacing/2+46*s,y:rnd(Math.round(70*s),Math.round(gt-70*s)),got:false});
    }
    f.obs.forEach(function(o){o.x-=speed*dt;
      if(!o.passed&&o.x+o.w<f.px-20*s){o.passed=true;f.score++;Snd.tone(880,0,.06,'sine',.08);flyStat()}
      var cx=o.x+o.w/2,top=o.gy-o.gap/2,bot=o.gy+o.gap/2;
      if(flyHitTri(f,o.x,0,o.x+o.w,0,cx,top)||flyHitTri(f,o.x,gt,o.x+o.w,gt,cx,bot))flyHurt(f)});
    if(M.over)return;
    f.obs=f.obs.filter(function(o){return o.x>-o.w-10});
    f.stars.forEach(function(st){st.x-=speed*dt;if(!st.got&&Math.abs(st.x-f.px)<30*s&&Math.abs(st.y-f.py)<30*s){st.got=true;f.starsGot++;Snd.coin();flyStat()}});
    f.stars=f.stars.filter(function(st){return st.x>-40*s&&!st.got});
  }else{f.py=H*.42+Math.sin(f.t*3)*8*s}
  var tgt=f.started?Math.max(-.35,Math.min(.5,f.vy/(650*s))):0;f.ang=(f.ang||0)+(tgt-(f.ang||0))*Math.min(1,dt*7);
  f.puffs.forEach(function(p){p.x-=speed*dt*(f.started?1:.3);p.a-=dt*1.6});f.puffs=f.puffs.filter(function(p){return p.a>0});
  flyDraw(f);
  M.raf=requestAnimationFrame(flyLoop);
}
function flyDraw(f){
  var c=f.ctx,s=f.s,W=f.W,H=f.H,gt=f.groundTop,bw=800*s,gw=808*s;
  c.fillStyle='#DDF0F8';c.fillRect(0,0,W,H);
  for(var x=-f.bgX;x<W;x+=bw)c.drawImage(FLY_IMGS.bg,x,H-480*s,bw,480*s);
  f.stars.forEach(function(st){c.drawImage(FLY_IMGS.star,st.x-17*s,st.y-17*s,34*s,34*s)});
  f.obs.forEach(function(o){var top=o.gy-o.gap/2,bot=o.gy+o.gap/2;

  // plane, tilted by its speed, blinking while protected after a hit
  if(!(f.inv>0&&Math.floor(f.inv*10)%2)){
    var fr=FLY_IMGS['p'+(1+Math.floor(f.t*12)%3)],ang=f.ang||0;
    c.save();c.translate(f.px,f.py);c.rotate(ang);c.drawImage(fr,-38*s,-31*s,76*s,63*s);c.restore();
  }
  c.font='400 '+Math.round(26*s)+'px sans-serif';c.textAlign='left';c.textBaseline='top';
  for(var l=0;l<3;l++){c.globalAlpha=l<f.lives?1:.25;c.fillText('❤️',10*s+l*30*s,10*s)}c.globalAlpha=1;
  c.textAlign='center';c.font='400 '+Math.round(54*s)+'px "Secular One",sans-serif';c.lineWidth=7*s;c.strokeStyle='#fff';c.fillStyle='#E8A33D';
  c.strokeText(String(f.score),W/2,14*s);c.fillText(String(f.score),W/2,14*s);
  if(!f.started){
    c.drawImage(FLY_IMGS.tap,f.px-30*s,f.py+42*s,59*s,59*s);
    c.direction='rtl';c.font='400 '+Math.round(30*s)+'px "Secular One",sans-serif';c.lineWidth=6*s;c.strokeStyle='#fff';c.fillStyle='#1B6DB3';
    c.strokeText('הקישו כדי להמריא!',W/2,H*.2);c.fillText('הקישו כדי להמריא!',W/2,H*.2);c.direction='ltr';
  }
}

function raceAvgMs(){ // the child's usual answer time in this journey, so opponents are a fair match

}
function initRace(){

    '<div class="rroad" id="rroad"><i class="rlane" style="left:25%"></i><i class="rlane" style="left:50%"></i><i class="rlane" style="left:75%"></i><div class="rfinish"></div>'+
    RACE_LANES.map(function(l,i){return '<div class="rcar'+(i===me?' me':'')+'" id="rcar'+i+'" style="left:'+(12.5+25*i)+'%"><img src="'+RIMG['car_'+l.c]+'" alt="">'+(i===me?'<span class="rme">'+avatarHTML(S.avatar||'panda',26,true)+'</span>':'')+'</div>'}).join('')+
    '</div><div class="rcount" id="rcount"></div></div>'+
    '<div class="rq"><div class="rq-top"><span id="rq-prompt"></span><button class="speak" data-act="speak" aria-label="הקרא את השאלה"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#1F2B47"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#1F2B47" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button></div><div class="rq-vis" id="rq-vis"></div><div class="rq-opts" id="rq-opts"></div></div></div>';
  raceDraw();raceStat();
  var cnt=$('#rcount');
  ['3','2','1','צאו!'].forEach(function(t,i){later(300+i*800,function(){if(!M||M.over)return;cnt.textContent=t;cnt.classList.remove('pop');void cnt.offsetWidth;cnt.classList.add('pop');Snd.tone(i<3?520:880,0,.25,'square',.12)})});
  later(300+3*800+500,function(){if(!M||M.over)return;cnt.textContent='';M.started=true;M.t0=Date.now();raceNext();
    M.iv=setInterval(function(){if(!M||M.over||M.kind!=='race')return;raceDraw();raceStat()},120)});
}
function raceProg(i){if(i===M.me)return M.solved/M.N;var o=M.opp[i];return M.started?Math.min(1,(Date.now()-M.t0)/o.T):0}
function raceDraw(){

var SIM_COLS=[['#EC5B78','#B83555',330],['#2FA0EA','#1B6DB3',415],['#4CBF5F','#2C8A3C',494],['#FFC940','#C98E0A',587]];

  $('#mini-title').textContent='תזכורת אורות';
  $('#mini-board').innerHTML='<div class="simon">'+SIM_COLS.map(function(c,i){return '<button class="spad" data-act="sim" data-k="'+i+'" style="background:'+c[0]+';box-shadow:0 7px 0 '+c[1]+'" aria-label="כפתור '+(i+1)+'"></button>'}).join('')+'</div>';
  later(700,simRound);
}
function simStat(){$('#mini-stat').textContent='שלב '+M.seq.length+' · 🏆'+(S.simBest||0)}
function simLight(i,ms){
  var b=$$('#mini-board .spad')[i];if(!b)return;b.classList.add('on');Snd.tone(SIM_COLS[i][2],0,Math.min(.5,ms/1000),'triangle',.28);
  later(ms,function(){b.classList.remove('on')});

function simRound(){
  if(!M||M.over)return;
  M.seq.push(rnd(0,3));M.input=0;M.lock=true;simStat();
  $('#mini-help').textContent='👀 הסתכלו...';
  var step=Math.max(380,650-25*(M.seq.length-1)); /* faster as the sequence grows */
  M.seq.forEach(function(k,i){later(400+i*step,function(){simLight(k,step*.6)})});
  later(400+M.seq.length*step,function(){if(!M||M.over)return;M.lock=false;$('#mini-help').textContent='👆 עכשיו תורכם!'});

function simTap(i){
  if(!M||M.over||M.lock)return;
  simLight(i,260);

    M.input++;

var DR=null,dragSuppress=false;

  $$('#lv-visual .slot').forEach(function(s){var r=s.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,d=(cx-x)*(cx-x)+(cy-y)*(cy-y);
    if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)d=0;if(d<bd){bd=d;best=s}});

}

  room:function(t){homeAct('room',t.getAttribute('data-k'))},
  'to-map':function(){clearTimers();stopMini();show('map')},
  'pick-locked':function(){Snd.wrong();toast('החבר הזה עוד נעול 🔒 פותחים חברים בתיבת אוצר בסוף עולם, או ברצף של 7 ימים')},
  album:function(){Snd.tap();albumTab=curBase();show('album')},
  'album-tab':function(t){albumTab=+t.getAttribute('data-b');Snd.tap();renderAlbum()},
  achs:function(){Snd.tap();show('achs')},
  games:function(){Snd.tap();clearTimers();stopMini();show('games')},
  'game-start':function(t){startMini(t.getAttribute('data-k'))},
  mem:function(t){memTap(+t.getAttribute('data-i'))},
  bal:function(t){balTap(t)},
  sim:function(t){simTap(+t.getAttribute('data-k'))},
  'trace-clear':function(){if(TR&&!TR.done){clearTimeout(TR.wait);TR.strokes=[];TR.cur=null;TR.hit={};TR.ink=0;Snd.tap();traceDraw()}},
  'box-open':function(){var R=LASTRES;if(!R||!R.res.box)return;Snd.tap();openBox(R.res.box,function(items){R.res.loot=items;renderResult(R.res,R.g,true)})},
  'box-tap':function(){boxTap()},
  'box-done':function(){var b=BX;BX=null;Snd.tap();if(b&&b.then)b.then(b.items);else show('map')},
  'race-ans':function(t){raceAnswer(+t.getAttribute('data-i'))},
  'mini-quit':function(){if(M&&!M.over)confirmBox('לצאת מהמשחקון?','הכרטיס לא יוחזר.','כן, לצאת',function(){clearTimers();stopMini();show('games')});else{clearTimers();stopMini();show('games')}},
  daily:function(){Snd.tap();openDaily()},
  'daily-close':function(){closeOv('ov-daily')},
  surp:function(t){openSurprise(+t.getAttribute('data-g'))},
  'chest-open':function(){clearTimers();openChest()},
  'chest-tap':function(){chestTap()},
  leave:function(){confirmBox('לצאת מהשלב?','ההתקדמות בשלב הזה לא תישמר.','כן, לצאת',function(){clearTimers();L=null;show('map')})},
  speak:function(){var q=M&&M.q?M.q:L&&L.q;if(q)speakText(q.say,true)},
  answer:function(t){if(dragSuppress)return;answer(+t.getAttribute('data-i'))},
  'next-level':function(t){startLevel(+t.getAttribute('data-g'))},
  retry:function(t){startLevel(+t.getAttribute('data-g'))},
  'parent-back':function(){show('map')},
  preset:function(t){S.set.max=+t.getAttribute('data-n');save();renderParent()},
  samples:function(){
    var p=levelParams(Math.round(rampLevels())),seen={},html='';
    for(var i=0;i<8;i++){var q=makeQuestion(p,seen,null,true);seen[q.key]=1;html+='<li><b>'+esc(q.title)+'</b><span>'+esc(q.text)+'</span></li>'}
    $('#samples').innerHTML=html;
  },
  jump:function(){var v=clamp(parseInt($('#f-jump').value,10)||1,1,999);S.done=v-1;viewWorld=Math.floor(S.done/S.set.perWorld);save();toast('השלב הבא: '+v);renderParent()},
  coins:function(){S.coins+=20;save();toast('נוספו 20 מטבעות');renderParent()},
  backup:function(){
    var d=dstr();S.lastBackup=d;save();
    var data=JSON.stringify({app:'masa-hamisparim',v:1,saved:new Date().toISOString(),state:S},null,1);
    try{
      var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
      a.download='גיבוי-ארץ-האותיות-'+(S.name?S.name+'-':'')+d+'.json';document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
      toast('💾 קובץ הגיבוי נשמר בהורדות');
    }catch(e){toast('לא הצלחתי לשמור קובץ בדפדפן הזה')}
    renderParent();
  },
  restore:function(){var f=$('#restore-file');if(f){f.value='';f.click()}},
  'reset-stats':function(){confirmBox('לאפס את נתוני הלמידה?','המשחק ישכח מה קל ומה קשה לילד/ה ויתחיל ללמוד מחדש.','כן, לאפס',function(){S.stats={};save();toast('נתוני הלמידה אופסו');renderParent()})},
  reset:function(){confirmBox('לאפס הכול?','יימחקו שלבים, כוכבים, מטבעות, פריטים ונתוני הלמידה. ההגדרות יישארו.','כן, לאפס',function(){var set=S.set;S=fresh();S.set=set;viewWorld=0;save();toast('ההתקדמות אופסה');show('start')})}
};
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var f=ACT[t.getAttribute('data-act')];if(f)f(t,e);
});
document.addEventListener('change',onSetChange);
document.addEventListener('keydown',function(e){if((e.key===' '||e.key==='ArrowUp')&&M&&M.kind==='fly'&&!$('#sc-mini').hidden){e.preventDefault();flyFlap()}});
document.addEventListener('change',function(e){
  if(!e.target||e.target.id!=='restore-file'||!e.target.files||!e.target.files[0])return;
  var rd=new FileReader();
  rd.onload=function(){
    var st=null;
    try{var j=JSON.parse(rd.result);st=j&&j.app==='masa-hamisparim'?j.state:null}catch(err){}
    if(!st||typeof st!=='object'||!st.set){toast('הקובץ הזה הוא לא גיבוי של המשחק');return}
    var info='שלבים: '+(st.done||0)+' · מטבעות: '+(st.coins||0)+(st.name?' · '+st.name:'');
    confirmBox('לטעון את הגיבוי?','ההתקדמות הנוכחית במכשיר הזה תוחלף. '+info,'כן, לטעון',function(){
      S=merge(fresh(),st);
      if(!S.friends.length&&S.avatar)S.friends=[S.avatar];
      save();viewWorld=Math.floor(S.done/S.set.perWorld);toast('✅ ההתקדמות נטענה');show('start');
    });
  };
  rd.readAsText(e.target.files[0]);
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&e.target.id==='gate-in')gateOK()});

if(!S.set.read&&S.track==='read')setTrack('math');
addStarters();
setImgs();
show('start');
})();
</script>
</body></html>
